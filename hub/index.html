<title>Water Data Literacy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy rail of modules (CE541E08 house style) beside a paper-toned main column of session ledgers; rail becomes a top strip on phones. */
:root {
  --rail: #13234a;          /* navy rail and card */
  --rail-ink: #e9ecf4;
  --rail-dim: #9aa6c4;
  --paper: #f6f4ef;         /* page ground */
  --surface: #ffffff;
  --ink: #18213a;
  --muted: #5d6680;
  --line: #e2ded4;
  --stripe: #faf8f3;
  --gold: #c9962e;          /* hours / badges */
  --gold-soft: #f6ead0;
  --water: #1f7a8c;         /* open / water accent */
  --water-soft: #e2f1f3;
  --lock: #9a8f7c;
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rail: #0c1530; --rail-ink: #e6e9f2; --rail-dim: #8e9aba;
    --paper: #111a30; --surface: #17223d; --ink: #e8ebf3; --muted: #a3acc4;
    --line: #2a3657; --stripe: #1a2644; --gold: #e0b252; --gold-soft: #3a3020;
    --water: #5cc3d4; --water-soft: #173a45; --lock: #8a8473; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --rail: #0c1530; --rail-ink: #e6e9f2; --rail-dim: #8e9aba;
  --paper: #111a30; --surface: #17223d; --ink: #e8ebf3; --muted: #a3acc4;
  --line: #2a3657; --stripe: #1a2644; --gold: #e0b252; --gold-soft: #3a3020;
  --water: #5cc3d4; --water-soft: #173a45; --lock: #8a8473; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: inherit; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }

/* rail */
.rail { background: var(--rail); color: var(--rail-ink); padding: 22px 0; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { padding: 0 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.eyebrow { font: 600 10.5px/1.3 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.brand h1 { font: 600 22px/1.15 var(--display); margin: 6px 0 4px; text-wrap: balance; }
.brand p { margin: 0 0 10px; color: var(--rail-dim); font-size: 12.5px; }
.pill { display: inline-block; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); padding: 5px 7px; border-radius: 3px; }
.rail h2 { font: 600 10.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--rail-dim); margin: 22px 18px 8px; }
.nav a { display: flex; gap: 10px; align-items: baseline; padding: 8px 18px; text-decoration: none; font-size: 13.5px; color: var(--rail-ink); border-left: 3px solid transparent; }
.nav a .k { font: 500 11px/1 var(--mono); color: var(--rail-dim); min-width: 22px; }
.nav a:hover { background: rgba(255,255,255,.05); }
.nav a[aria-current="page"] { background: rgba(255,255,255,.08); border-left-color: var(--gold); }
.nav a:focus-visible, .btn:focus-visible, .ql a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ql { list-style: none; margin: 0; padding: 0 18px; display: grid; gap: 9px; font-size: 12.5px; }
.ql a { text-decoration: none; color: var(--rail-ink); display: flex; gap: 8px; align-items: center; }
.ql a:hover { text-decoration: underline; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.teal { background: var(--water); } .dot.gold { background: var(--gold); }

/* main */
main { padding-block: 26px 48px; padding-inline: clamp(16px, 4vw, 44px); min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.head h2 { font: 600 clamp(22px, 3vw, 30px)/1.15 var(--display); margin: 0; text-wrap: balance; }
.tag { font: 600 11px/1 var(--mono); letter-spacing: .06em; background: var(--rail); color: #fff; padding: 7px 10px; border-radius: 4px; white-space: nowrap; }
.card { background: var(--rail); color: var(--rail-ink); border-radius: 10px; padding: 20px 22px; margin-bottom: 22px; }
.card .eyebrow { color: var(--rail-dim); }
.card h3 { font: 600 21px/1.2 var(--display); margin: 6px 0 8px; }
.card p { margin: 0; color: var(--rail-dim); font-size: 13.5px; max-width: 72ch; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chip { font: 600 11.5px/1 var(--body); padding: 6px 10px; border-radius: 999px; }
.chip.hours { background: var(--gold); color: #1b1407; }
.chip.co { background: var(--water-soft); color: var(--water); border-radius: 4px; }
.card code { font: 12px var(--mono); background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 3px; color: var(--gold-soft); }
.card a.edit { display: inline-block; margin-top: 14px; background: var(--gold); color: #1b1407; font: 600 12.5px/1 var(--body); padding: 9px 12px; border-radius: 4px; text-decoration: none; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 12px; text-align: center; }
.stat b { display: block; font: 600 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: 500 10.5px/1.3 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.section-title { font: 600 17px/1.2 var(--display); margin: 0 0 12px; padding-left: 10px; border-left: 3px solid var(--gold); }
.mods { display: grid; gap: 10px; }
.mod { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; text-decoration: none; }
.mod:hover { border-color: var(--water); }
.mod .badge { font: 600 12px/1 var(--mono); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; background: var(--water-soft); color: var(--water); }
.mod strong { display: block; font-weight: 600; font-size: 14.5px; }
.mod small { color: var(--muted); font-size: 12.5px; }
.mod .count { font: 500 11.5px/1 var(--mono); color: var(--gold); white-space: nowrap; }

/* session ledger */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
thead th { background: var(--rail); color: #fff; font: 600 10.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; text-align: left; padding: 13px 14px; }
tbody td { padding: 13px 14px; border-top: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
tbody tr:nth-child(even) td { background: var(--stripe); }
.num { font: 500 12px/1 var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; display: inline-block; font-variant-numeric: tabular-nums; }
.topic strong { display: block; font-weight: 600; }
.topic em { color: var(--muted); font-size: 12.5px; }
.ws strong::before { content: "Workshop · "; color: var(--gold); font-weight: 600; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { font: 500 11.5px/1 var(--mono); padding: 7px 9px; border: 1px solid var(--rail); border-radius: 4px; text-decoration: none; color: var(--ink); background: var(--surface); white-space: nowrap; }
:root[data-theme="dark"] .btn { border-color: var(--line); }
.btn::before { content: "↗ "; color: var(--muted); }
.btn.alt { border-color: var(--gold); color: var(--gold); }
.btn:hover { background: var(--water-soft); }
.btn[aria-disabled="true"] { opacity: .45; pointer-events: none; border-style: dashed; }
.status { font-size: 12.5px; white-space: nowrap; color: var(--water); }
.status::before { content: "● "; }
.status.locked { color: var(--lock); }
.status.locked::before { content: "◌ "; }
.note { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.err { background: var(--gold-soft); border: 1px solid var(--gold); padding: 14px 16px; border-radius: 8px; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; padding: 14px 0 6px; }
  .brand { padding: 0 16px 12px; }
  .rail h2 { margin: 12px 16px 6px; }
  .nav { display: flex; overflow-x: auto; padding: 0 10px 8px; gap: 4px; }
  .nav a { border-left: 0; border-bottom: 2px solid transparent; padding: 7px 10px; white-space: nowrap; }
  .nav a[aria-current="page"] { border-bottom-color: var(--gold); }
  .ql-wrap { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .mod, .btn { transition: border-color .15s, background .15s; } }
</style>

<div class="app">
  <aside class="rail" aria-label="Course navigation">
    <div class="brand">
      <div class="eyebrow">CHRIST University · CuX</div>
      <h1>Water Data Literacy</h1>
      <p>Hydroinformatics in a Changing Climate</p>
      <span class="pill">Course delivery hub</span>
    </div>
    <h2>Modules</h2>
    <nav class="nav" id="nav"></nav>
    <div class="ql-wrap">
      <h2>Quick links</h2>
      <ul class="ql" id="ql"></ul>
    </div>
  </aside>
  <main id="view" aria-live="polite"><p class="note">Loading sessions…</p></main>
</div>

<script>
const ROMAN = ["", "I", "II", "III", "IV", "V", "VI"];
let DATA = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const colab = p => `https://colab.research.google.com/github/${DATA.github.user}/${DATA.github.repo}/blob/${DATA.github.branch}/${p}`;
const link = (label, url, cls = "", on = true) =>
  `<a class="btn ${cls}" href="${on && url ? esc(url) : "#"}" target="_blank" rel="noopener"${on && url ? "" : ' aria-disabled="true" tabindex="-1"'}>${esc(label)}</a>`;

function nav(current) {
  const items = [["home", "⌂", "Home"], ...DATA.modules.map(m => [`m${m.n}`, `M${m.n}`, m.title])];
  document.getElementById("nav").innerHTML = items.map(([id, k, t]) =>
    `<a href="#${id}"${id === current ? ' aria-current="page"' : ""}><span class="k">${k}</span><span>${esc(t)}</span></a>`).join("");
  document.getElementById("ql").innerHTML = DATA.quick_links.map(q =>
    `<li><a href="${esc(q.url)}" target="_blank" rel="noopener"><span class="dot ${esc(q.dot)}"></span>${esc(q.label)}</a></li>`).join("") +
    `<li><a href="https://github.com/${DATA.github.user}/${DATA.github.repo}/edit/${DATA.github.branch}/hub/sessions.json" target="_blank" rel="noopener"><span class="dot gold"></span>Enable sessions</a></li>`;
}

function home() {
  const S = DATA.sessions, open = S.filter(s => s.enabled).length;
  const editUrl = `https://github.com/${DATA.github.user}/${DATA.github.repo}/edit/${DATA.github.branch}/hub/sessions.json`;
  return `
  <div class="head"><h2>Course Delivery Hub</h2><span class="tag">WDL · ${esc(DATA.course.year)}</span></div>
  <section class="card">
    <div class="eyebrow" style="color:var(--gold)">Instructor: release a session</div>
    <p style="color:var(--rail-ink);margin-top:8px">Open <code>hub/sessions.json</code> on GitHub, find the session, change <code>"enabled": false</code> to <code>"enabled": true</code> and commit. Learners refresh this page and the links appear.</p>
    <a class="edit" href="${esc(editUrl)}" target="_blank" rel="noopener">Edit sessions.json →</a>
  </section>
  <div class="stats">
    <div class="stat"><b>${open}</b><span>Sessions open</span></div>
    <div class="stat"><b>${S.length - open}</b><span>Locked</span></div>
    <div class="stat"><b>${S.length}</b><span>Total sessions</span></div>
    <div class="stat"><b>${DATA.modules.length}</b><span>Modules</span></div>
  </div>
  <h3 class="section-title">Modules: choose one to see its sessions</h3>
  <div class="mods">${DATA.modules.map(m => {
    const ms = S.filter(s => s.module === m.n), o = ms.filter(s => s.enabled).length;
    const first = ms[0].num, last = ms[ms.length - 1].num;
    return `<a class="mod" href="#m${m.n}"><span class="badge">M${m.n}</span>
      <span><strong>${esc(m.title)}</strong><small>Sessions ${first}–${last} · ${esc(ms.slice(0, 3).map(s => s.title.split(";")[0]).join(" · "))}</small></span>
      <span class="count">${o} / ${ms.length} open →</span></a>`;
  }).join("")}</div>
  <p class="note">Each session is about one hour: short videos (5 minutes or less), a reading notebook, a practice activity in Colab or Sheets, and a reference. Session 5 of every module is a workshop.</p>`;
}

function module(n) {
  const m = DATA.modules.find(x => x.n === n);
  if (!m) return home();
  const ms = DATA.sessions.filter(s => s.module === n);
  const rows = ms.map(s => {
    const on = s.enabled;
    const vids = s.videos.map(v => link(v.label, v.url, "", on)).join("");
    const nbs = s.notebooks.map(b => link(b.label, colab(b.path), "", on)).join("");
    const extra = s.workshop ? link("Submit", s.submit, "alt", on)
      : (s.reference && s.reference.url ? link("Reference", s.reference.url, "alt", on) : "");
    return `<tr>
      <td><span class="num">${String(s.num).padStart(2, "0")}</span></td>
      <td class="topic${s.workshop ? " ws" : ""}"><strong>${esc(s.workshop ? s.title.replace(/^Workshop: /, "") : s.title)}</strong><em>${esc(s.hook)}</em></td>
      <td><div class="btns">${vids}</div></td>
      <td><div class="btns">${nbs}${link("Sheet", s.sheet, "alt", on)}</div></td>
      <td><div class="btns">${extra}</div></td>
      <td><span class="status${on ? "" : " locked"}">${on ? "Open" : "Locked"}</span></td>
    </tr>`;
  }).join("");
  return `
  <div class="head"><h2>Module ${n}: ${esc(m.title)}</h2><span class="tag">SESSIONS ${ms[0].num}–${ms[ms.length - 1].num}</span></div>
  <section class="card">
    <div class="eyebrow">Module ${ROMAN[n]} · ${esc(m.co)}</div>
    <h3>${esc(m.title)}</h3>
    <p>${esc(m.about)}</p>
    <div class="chips"><span class="chip hours">05 Hours</span><span class="chip co">${esc(m.co)}</span></div>
  </section>
  <div class="ledger"><table>
    <thead><tr><th>#</th><th>Session &amp; water hook</th><th>Videos</th><th>Notebooks &amp; sheet</th><th>Reference / submit</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <p class="note">Notebooks open in Google Colab. Use File → Save a copy in Drive before you start. Sheet links make your own copy in Google Sheets.</p>`;
}

function render() {
  const h = (location.hash || "#home").slice(1);
  const n = /^m([1-6])$/.test(h) ? Number(h.slice(1)) : null;
  nav(n ? `m${n}` : "home");
  document.getElementById("view").innerHTML = n ? module(n) : home();
  window.scrollTo(0, 0);
}

fetch("sessions.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; render(); window.addEventListener("hashchange", render); })
  .catch(() => {
    document.getElementById("view").innerHTML =
      `<div class="err"><strong>Sessions could not be loaded.</strong> Check that sessions.json sits next to this page and is valid JSON, then refresh.</div>`;
  });
</script>
